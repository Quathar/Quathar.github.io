---
- name: Create VS Code user configuration directory
  ansible.builtin.file:
    path: '{{ ansible_env.HOME }}/.config/Code/User'
    state: directory
    mode: '0755'

- name: Copy global VS Code settings
  ansible.builtin.copy:
    src: global/settings.json
    dest: '{{ ansible_env.HOME }}/.config/Code/User/settings.json'
    mode: '0644'

- name: Copy global VS Code keybindings
  ansible.builtin.copy:
    src: global/keybindings.json
    dest: '{{ ansible_env.HOME }}/.config/Code/User/keybindings.json'
    mode: '0644'

- name: Install global VS Code extensions
  ansible.builtin.command:
    cmd: 'code --install-extension {{ item }}'
  loop: "{{ lookup('file', 'global/extensions.txt').splitlines() }}"
  register: vscode_global_extensions
  changed_when: "'already installed' not in vscode_global_extensions.stdout"
